[project]
name = "qa-automation-framework-playwright"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "allure-pytest>=2.16.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.8.0",
]

[tool.pytest]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
]
markers = [
    "ui: marks tests that exercise the user interface",
    "api: marks tests that exercise API endpoints",
]
base_url = "https://automationexercise.com"
