name: Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install project dependencies
        run: uv sync --locked

      - name: Run API tests
        run: uv run pytest -m api

  ui-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
    
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
        
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        
      - name: Install project dependencies
        run: uv sync --locked
        
      - name: Install Allure CLI
        run: npm install -g allure
        
      - name: Install Playwright browser
        run: uv run playwright install --with-deps ${{ matrix.browser }}
        
      - name: Run UI tests
        run: >
          uv run pytest -m ui
          --browser ${{ matrix.browser }}
          --alluredir=allure-results
          --clean-alluredir
        
      - name: Generate Allure report
        if: always()
        run: allure generate allure-results --output allure-report
        
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-ui-${{ matrix.browser }}
          path: allure-report/
        
      - name: Upload UI failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-failure-evidence-${{ matrix.browser }}
          path: test-results/

  code-quality:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
    
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
        
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        
      - name: Install project dependencies
        run: uv sync --locked
        
      - name: Run Ruff lint checks
        run: uv run ruff check .
        
      - name: Run Ruff format checks
        run: uv run ruff format --check .
        
      - name: Run mypy
        run: uv run mypy .